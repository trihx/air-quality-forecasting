# ══════════════════════════════════════════════════════════════
# Keep Render App & Supabase Database Alive (Keep-Alive Safety Net)
# ══════════════════════════════════════════════════════════════
# Mục tiêu: Ngăn chặn Render Free Tier ngủ đông (sau 15 phút)
# và ngăn Supabase Free Tier bị tạm dừng (sau 7 ngày không có query).
# ══════════════════════════════════════════════════════════════

name: Keep Render & Supabase Alive

on:
  schedule:
    # Chạy mỗi 10 phút một lần
    - cron: '*/10 * * * *'
  workflow_dispatch: # Cho phép kích hoạt thủ công từ GitHub Actions UI

jobs:
  ping-services:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Web Service & Supabase Database
        run: |
          TARGET_URLS=(
            "https://pm25.hoangxuantri.id.vn"
            "https://pm25-air-quality-forecasting.onrender.com"
          )

          for URL in "${TARGET_URLS[@]}"; do
            echo "🏓 Pinging target: $URL ..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL" || echo "000")
            
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
              echo "✅ $URL is active! (HTTP $HTTP_CODE)"
            else
              echo "⚠️ $URL returned HTTP $HTTP_CODE — retrying after 15s (waking up instance)..."
              sleep 15
              RETRY_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL" || echo "000")
              echo "🔄 Retry result for $URL: HTTP $RETRY_CODE"
            fi
          done



