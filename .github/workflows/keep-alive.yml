# Keep Render App & Supabase Alive
#
# Render.com free tier sleeps after 15 minutes of inactivity.
# Supabase free tier pauses database after 7 days of inactivity.
#
# Solution:
#   This workflow pings the app every 12 minutes (before the 15m sleep timeout).
#   Each ping reaches Streamlit & triggers DB query via health endpoint, keeping both active.

name: Keep Render & Supabase Alive

on:
  schedule:
    # Run every 12 minutes to beat Render's 15-minute sleep timer
    - cron: '*/12 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render App & Supabase DB
        run: |
          RENDER_URL="${{ secrets.RENDER_URL }}"
          if [ -z "$RENDER_URL" ]; then
            # Default fallback URL for the project if secret is not set yet
            RENDER_URL="https://time-series-forecasting-c8gz.onrender.com"
          fi

          # Trim trailing slash
          RENDER_URL="${RENDER_URL%/}"

          echo "🏓 Pinging Render App: $RENDER_URL ..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$RENDER_URL")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
            echo "✅ Render App is awake! HTTP $HTTP_CODE"
          else
            echo "⚠️ Render App returned HTTP $HTTP_CODE — retrying after 30s (cold start recovery)..."
            sleep 30
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$RENDER_URL")
            echo "🔄 Retry result: HTTP $HTTP_CODE"
          fi

