[project]
name = "time-series-forecasting"
version = "0.1.0"
description = "Dự báo chuỗi thời gian PM2.5 — ML/DL pipeline với data quality, experiment tracking, và reproducibility"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.5",
    "fastapi>=0.136.1",
    "ipykernel>=7.2.0",
    "jupyter-client>=8.8.0",
    "lightgbm>=4.6.0",
    "loguru>=0.7.0",
    "matplotlib>=3.10.8",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
    "notebook>=7.5.5",
    "numpy>=2.4.3",
    "openai>=2.30.0",
    "optuna>=4.8.0",
    "pandas>=3.0.1",
    "papermill>=2.7.0",
    "plotly>=6.6.0",
    "pmdarima>=2.1.1",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.12.5",
    "pymupdf>=1.27.2.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.3.0",
    "shap>=0.51.0",
    "shapash>=2.5.0",
    "sqlalchemy>=2.0.49",
    "statsmodels>=0.14.6",
    "streamlit>=1.56.0",
    "torch>=2.11.0",
    "uvicorn>=0.43.0",
    "watchdog>=6.0.0",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "bandit>=1.8.0",
    "mypy>=1.14.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "great-expectations>=1.3.0",
]

# ============================================================
# TOOL CONFIGURATION
# ============================================================

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "S",    # bandit (subset via ruff)
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = ["S101", "N803", "N806"]  # Allow assert + sklearn uppercase X convention

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "N803", "N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
